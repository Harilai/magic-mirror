name: Serveronly runtime benchmark (1 GiB cgroup)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/magicmirror-serveronly-deployment
    paths:
      - "config/config.js"
      - "defaultmodules/**"
      - "modules/MMM-Meteosat/**"
      - "modules/MMM-Spotify/**"
      - "modules/MMM-Remote-Control/**"
      - "modules/MMM-MagicMover/**"
      - "modules/MMM-TodayEvents/**"
      - "scripts/serveronly-resource-monitor.js"
      - "scripts/serveronly-kiosk.js"
      - "serveronly/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/serveronly-runtime-benchmark.yml"

permissions:
  contents: read

jobs:
  runtime-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install Linux display dependencies
        run: |
          mkdir -p benchmark-results
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick

      - name: Install MagicMirror dependencies
        run: |
          # The repository lockfile currently lags package.json (notably MSW).
          # Resolve from package.json in this clean runner rather than failing npm ci.
          npm install --include=dev --omit=optional --no-audit --no-fund
          npm ci --prefix modules/MMM-Meteosat --no-audit --no-fund
          npm install --prefix modules/MMM-Spotify --omit=dev --no-audit --no-fund
          npm install --prefix modules/MMM-Remote-Control --omit=dev --no-audit --no-fund

          # Use Playwright's Chromium binary directly so that all browser
          # child processes inherit the systemd service cgroup.
          CHROMIUM_BIN="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          if [ ! -x "${CHROMIUM_BIN}" ]; then
            npx playwright install chromium
            CHROMIUM_BIN="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          fi
          test -x "${CHROMIUM_BIN}"
          "${CHROMIUM_BIN}" --version | tee benchmark-results/browser-info.txt

      - name: Enable diagnostic logging for Meteosat
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "config/config.js";
          const source = fs.readFileSync(file, "utf8");
          const marker = '\t\t\tmodule: "MMM-Meteosat",\n\t\t\tposition: "bottom_left",\n\t\t\tconfig: {';
          if (!source.includes(marker)) throw new Error("MMM-Meteosat config block was not found.");
          if (!source.includes('logLevel: "DEBUG"')) {
            fs.writeFileSync(file, source.replace(marker, marker + '\n\t\t\t\tlogLevel: "DEBUG",'));
          }
          console.log("Enabled DEBUG logging for MMM-Meteosat in the ephemeral CI checkout only.");
          NODE

      - name: Probe EUMETSAT WMS and image pipeline
        continue-on-error: true
        timeout-minutes: 4
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { resolveProduct } = require("./modules/MMM-Meteosat/src/products");
          const { fetchLatestImageTime, downloadWmsImage } = require("./modules/MMM-Meteosat/src/sources/wms");
          const { processImage } = require("./modules/MMM-Meteosat/src/imageProcessor");

          (async () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), "meteosat-ci-probe-"));
            const report = {
              startedAt: new Date().toISOString(),
              endpoint: "https://view.eumetsat.int/geoserver/wms",
              product: process.env.MM_METEOSAT_PRODUCT || "geocolour",
              configuredSourceSize: 1800,
              configuredRenderSize: 700
            };
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(new Error("Diagnostic probe exceeded 120 seconds.")), 120000);
            const debug = (message, details) => console.log("[Meteosat probe] " + message + ": " + JSON.stringify(details || {}));
            try {
              const selection = resolveProduct(report.product);
              report.layer = selection.profile.layer;
              const capabilities = await fetchLatestImageTime(
                selection.profile,
                "MagicMirror-MMM-Meteosat-CI-Diagnostic/1.0",
                debug,
                controller.signal
              );
              report.capabilities = {
                source: capabilities.source,
                imageTime: capabilities.imageTime || null,
                dimension: capabilities.dimension || null,
                durationMs: capabilities.durationMs
              };

              const sourceFile = path.join(root, "source.png");
              const processedFile = path.join(root, "rendered.png");
              const downloaded = await downloadWmsImage({
                profile: selection.profile,
                targetFile: sourceFile,
                tempFile: path.join(root, "source.tmp"),
                size: 1800,
                userAgent: "MagicMirror-MMM-Meteosat-CI-Diagnostic/1.0",
                imageTime: capabilities.imageTime,
                debug,
                signal: controller.signal
              });
              report.download = {
                bytes: downloaded.bytes,
                durationMs: downloaded.durationMs,
                imageTime: downloaded.imageTime,
                source: downloaded.source,
                metadata: downloaded.metadata
              };

              const processed = await processImage({
                sourceFile,
                targetFile: processedFile,
                tempFile: path.join(root, "rendered.tmp"),
                renderSize: 700,
                signal: controller.signal,
                debug
              });
              report.processing = processed;
              report.outputBytes = fs.statSync(processedFile).size;
              report.status = "success";
            } catch (error) {
              report.status = "failed";
              report.error = {
                name: error.name,
                message: error.message,
                status: error.status || null,
                retryable: error.retryable === true,
                details: error.details || null
              };
              console.error("[Meteosat probe] FAILED", JSON.stringify(report.error));
              process.exitCode = 1;
            } finally {
              clearTimeout(timeout);
              report.finishedAt = new Date().toISOString();
              fs.writeFileSync("benchmark-results/meteosat-probe.json", JSON.stringify(report, null, 2));
              fs.rmSync(root, { recursive: true, force: true });
              console.log("[Meteosat probe report]", JSON.stringify(report, null, 2));
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Configure strict 1 GiB cgroup v2 limit
        run: |
          set -euo pipefail
          mkdir -p benchmark-results

          if ! grep -qw memory /sys/fs/cgroup/cgroup.controllers; then
            echo "The runner does not expose the cgroup v2 memory controller." >&2
            cat /sys/fs/cgroup/cgroup.controllers >&2 || true
            exit 1
          fi
          if ! command -v systemd-run >/dev/null || ! systemctl show-environment >/dev/null 2>&1; then
            echo "systemd is unavailable; refusing to run an unconstrained benchmark." >&2
            exit 1
          fi

          sudo tee /run/systemd/system/magicmirror-benchmark.slice >/dev/null <<'EOF'
          [Unit]
          Description=MagicMirror benchmark constrained memory slice

          [Slice]
          MemoryAccounting=yes
          MemoryMax=1G
          MemorySwapMax=0
          EOF

          sudo systemctl daemon-reload
          sudo systemctl start magicmirror-benchmark.slice

          CGROUP_REL="$(systemctl show --property=ControlGroup --value magicmirror-benchmark.slice)"
          CGROUP_PATH="/sys/fs/cgroup${CGROUP_REL}"
          test -n "${CGROUP_REL}"
          test -f "${CGROUP_PATH}/memory.max"
          test -f "${CGROUP_PATH}/memory.swap.max"

          MEMORY_MAX="$(sudo cat "${CGROUP_PATH}/memory.max")"
          SWAP_MAX="$(sudo cat "${CGROUP_PATH}/memory.swap.max")"
          test "${MEMORY_MAX}" = "1073741824"
          test "${SWAP_MAX}" = "0"

          {
            echo "cgroup_version=2"
            echo "cgroup_path=${CGROUP_PATH}"
            echo "memory.max=${MEMORY_MAX}"
            echo "memory.swap.max=${SWAP_MAX}"
            echo "memory_limit=1 GiB"
            echo "swap_limit=0 bytes"
          } | tee benchmark-results/cgroup-config.txt

          # Clear the runner's pre-existing page cache. Without a cold start,
          # executable/library pages cached during dependency installation
          # can be charged to the host cgroup instead of this workload slice.
          sudo sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          echo "drop_caches=3 (cold-cache start)" | tee -a benchmark-results/cgroup-config.txt

      - name: Start MagicMirror Serveronly inside constrained slice
        env:
          MM_REMOTE_CONTROL_API_KEY: ${{ secrets.MM_REMOTE_CONTROL_API_KEY }}
        run: |
          set -euo pipefail
          # Use a one-run key when no repository secret is configured.
          if [ -z "${MM_REMOTE_CONTROL_API_KEY}" ]; then
            export MM_REMOTE_CONTROL_API_KEY="$(openssl rand -hex 32)"
          fi

          sudo systemd-run --quiet --collect \
            --unit=magicmirror-server \
            --slice=magicmirror-benchmark.slice \
            --property="User=$(id -un)" \
            --property="Group=$(id -gn)" \
            --property="WorkingDirectory=${GITHUB_WORKSPACE}" \
            --setenv="PATH=${PATH}" \
            --setenv="HOME=${HOME}" \
            --setenv="MM_REMOTE_CONTROL_API_KEY=${MM_REMOTE_CONTROL_API_KEY}" \
            --setenv="MM_METEOSAT_LOG_LEVEL=DEBUG" \
            /bin/bash -c 'npm run server >> benchmark-results/server.log 2>&1'

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/ >/dev/null; then
              echo "MagicMirror Serveronly is ready."
              exit 0
            fi
            if ! systemctl is-active --quiet magicmirror-server.service; then
              sudo journalctl -u magicmirror-server.service --no-pager -n 100 || true
              cat benchmark-results/server.log || true
              exit 1
            fi
            sleep 1
          done
          sudo journalctl -u magicmirror-server.service --no-pager -n 100 || true
          cat benchmark-results/server.log || true
          echo "Serveronly did not become ready within 60 seconds."
          exit 1

      - name: Launch Chromium kiosk inside constrained slice
        run: |
          set -euo pipefail
          # Chromium runs as a direct child of the systemd kiosk service.
          # --no-sandbox is restricted to this disposable GitHub CI runner.
          CHROMIUM_BIN="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "${CHROMIUM_BIN}"
          cat > /tmp/chromium-ci-wrapper <<EOF
          #!/usr/bin/env bash
          exec "${CHROMIUM_BIN}" --no-sandbox --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 "\$@"
          EOF
          chmod +x /tmp/chromium-ci-wrapper

          # Keep a fixed Full HD X server alive for the kiosk and screenshot
          # step. TCP is disabled; -ac allows the runner user to capture the
          # framebuffer without carrying xvfb-run's temporary Xauthority.
          sudo systemd-run --quiet --collect \
            --unit=magicmirror-xvfb \
            --slice=magicmirror-benchmark.slice \
            /usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac
          sleep 2
          if ! systemctl is-active --quiet magicmirror-xvfb.service; then
            sudo journalctl -u magicmirror-xvfb.service --no-pager -n 50 || true
            exit 1
          fi

          sudo systemd-run --quiet --collect \
            --unit=magicmirror-kiosk \
            --slice=magicmirror-benchmark.slice \
            --property="User=$(id -un)" \
            --property="Group=$(id -gn)" \
            --property="WorkingDirectory=${GITHUB_WORKSPACE}" \
            --setenv="PATH=${PATH}" \
            --setenv="HOME=${HOME}" \
            --setenv="DISPLAY=:99" \
            --setenv="MM_BROWSER_BIN=/tmp/chromium-ci-wrapper" \
            --setenv="MM_KIOSK_DISABLE_BREAKPAD=1" \
            /bin/bash -c 'npm run server:kiosk >> benchmark-results/kiosk.log 2>&1'

          sleep 20
          if ! systemctl is-active --quiet magicmirror-kiosk.service || ! pgrep -af '[c]hrome|[c]hromium' >/dev/null; then
            sudo journalctl -u magicmirror-kiosk.service --no-pager -n 100 || true
            cat benchmark-results/kiosk.log || true
            exit 1
          fi

          # A hard cgroup limit is meaningful only if Chromium's complete
          # process tree remains inside the constrained slice. Flatpak may
          # delegate application processes to separate systemd scopes, so
          # the benchmark uses the direct Playwright binary and audits /proc.
          CGROUP_REL="$(systemctl show --property=ControlGroup --value magicmirror-benchmark.slice)"
          CGROUP_PATH="/sys/fs/cgroup${CGROUP_REL}"
          node - "${CGROUP_PATH}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const cgroupPath = process.argv[2];
          const expected = fs.realpathSync(cgroupPath);
          const matched = [];
          for (const pid of fs.readdirSync("/proc").filter((value) => /^\d+$/.test(value))) {
            try {
              const command = fs.readFileSync(path.join("/proc", pid, "cmdline"), "utf8").replace(/\0/g, " ").trim();
              if (!/(chrome|chromium|crashpad|Xvfb :99|node \.\/serveronly|serveronly-kiosk)/i.test(command)) continue;
              const line = fs.readFileSync(path.join("/proc", pid, "cgroup"), "utf8").split("\n").find((value) => value.startsWith("0::"));
              const group = line ? line.slice(3) : "";
              const inside = group === expected.replace("/sys/fs/cgroup", "") || group.startsWith(expected.replace("/sys/fs/cgroup", "") + "/");
              matched.push({ pid: Number(pid), command: command.slice(0, 220), cgroup: group, inside });
            } catch {}
          }
          const chromium = matched.filter((entry) => /chrome|chromium/i.test(entry.command));
          const outside = matched.filter((entry) => !entry.inside);
          const report = { expectedCgroup: expected, matchingProcessCount: matched.length, chromiumProcessCount: chromium.length, outsideCgroup: outside, processes: matched };
          fs.writeFileSync("benchmark-results/cgroup-process-audit.json", JSON.stringify(report, null, 2));
          console.log("[Cgroup process audit]", JSON.stringify(report, null, 2));
          if (!chromium.length) throw new Error("No Chromium process was found in /proc.");
          if (outside.length) throw new Error("One or more application processes escaped the constrained cgroup.");
          NODE

          # Capture the actual kiosk X11 framebuffer at the intended Full HD
          # panel resolution. This is visual-regression evidence, not a
          # headless-browser substitute.
          sleep 10
          curl --silent --show-error --fail http://127.0.0.1:9222/json/list > benchmark-results/browser-targets.json
          node <<'NODE'
          const fs = require("node:fs");
          const targets = JSON.parse(fs.readFileSync("benchmark-results/browser-targets.json", "utf8"));
          const page = targets.find((target) => target.type === "page" && target.url.startsWith("http://127.0.0.1:8080/"));
          if (!page) {
            console.error("Chromium did not expose a page at the MagicMirror URL.");
            console.error(targets.map(({ type, url, title }) => ({ type, url, title })));
            process.exit(1);
          }
          console.log(JSON.stringify({ url: page.url, title: page.title }, null, 2));
          NODE
          # Sample the real kiosk framebuffer over the first 70 seconds so that
          # Meteosat's initial image fetch and the module's display transitions
          # are represented. The screenshot is never used to drive the UI.
          for frame in 01 02 03 04 05; do
            DISPLAY=:99 import -window root -silent "benchmark-results/kiosk-screen-${frame}.png"
            sleep 15
          done
          identify benchmark-results/kiosk-screen-*.png

      - name: Measure application for 10 minutes under 1 GiB limit
        run: |
          set -euo pipefail
          CGROUP_REL="$(systemctl show --property=ControlGroup --value magicmirror-benchmark.slice)"
          CGROUP_PATH="/sys/fs/cgroup${CGROUP_REL}"

          npm run server:resource-monitor -- --duration=600 --interval=2 --output=benchmark-results/runtime-resources.json

          # Capture a final Full HD frame after the complete memory window,
          # when the Meteosat image and other initial module data have loaded.
          DISPLAY=:99 import -window root -silent benchmark-results/kiosk-screen-final.png
          curl --silent --show-error --fail http://127.0.0.1:9222/json/list > benchmark-results/browser-targets-final.json
          identify benchmark-results/kiosk-screen-final.png

          # Inspect the rendered modules through Chromium DevTools Protocol.
          node <<'NODE' || echo "Browser DevTools diagnostics failed; see workflow logs."
          const fs = require("node:fs");
          (async () => {
            const targets = JSON.parse(fs.readFileSync("benchmark-results/browser-targets-final.json", "utf8"));
            const page = targets.find((target) => target.type === "page" && target.url.startsWith("http://127.0.0.1:8080/"));
            if (!page?.webSocketDebuggerUrl) throw new Error("MagicMirror browser target is missing a DevTools WebSocket.");
            const ws = new WebSocket(page.webSocketDebuggerUrl);
            const pending = new Map();
            const events = [];
            let nextId = 0;
            ws.addEventListener("message", (event) => {
              const message = JSON.parse(event.data.toString());
              if (message.id && pending.has(message.id)) {
                const waiter = pending.get(message.id);
                pending.delete(message.id);
                if (message.error) waiter.reject(new Error(message.error.message));
                else waiter.resolve(message.result);
              } else if (message.method === "Runtime.exceptionThrown" || message.method === "Log.entryAdded" || message.method === "Network.loadingFailed") {
                events.push(message);
              }
            });
            const call = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++nextId;
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
            try {
              await new Promise((resolve, reject) => {
                ws.addEventListener("open", resolve, { once: true });
                ws.addEventListener("error", reject, { once: true });
              });
              await call("Runtime.enable");
              await call("Log.enable");
              await call("Network.enable");
              const expression = '(() => { const mr=document.querySelector(".MMM-Meteosat"); const mv=mr?.querySelector(".mmm-meteosat"); const im=mv?.querySelector("img.mmm-meteosat-image"); const sr=document.querySelector(".MMM-Spotify"); return {title:document.title,meteosat:{modulePresent:Boolean(mr),statusText:mv?.innerText||"",imagePresent:Boolean(im),imageLoaded:Boolean(im&&im.complete&&im.naturalWidth>0),imageNaturalWidth:im?.naturalWidth||0,imageNaturalHeight:im?.naturalHeight||0,imageSource:im?.currentSrc||im?.src||null},spotify:{modulePresent:Boolean(sr),visibleText:sr?.innerText||""},loadedMeteosatResources:performance.getEntriesByType("resource").map(x=>x.name).filter(x=>x.includes("MMM-Meteosat"))}; })()';
              const result = await call("Runtime.evaluate", { returnByValue: true, expression });
              const report = {
                capturedAt: new Date().toISOString(),
                dom: result.result?.value || null,
                browserEvents: events
              };
              fs.writeFileSync("benchmark-results/browser-diagnostics.json", JSON.stringify(report, null, 2));
              console.log("[Browser diagnostics]", JSON.stringify(report, null, 2));
              if (!report.dom?.meteosat?.imageLoaded) console.warn("Meteosat image is not loaded in the browser.");
              if (report.dom?.spotify?.modulePresent) console.log("Spotify module is present; real playback still requires user OAuth credentials and an active device.");
            } finally {
              ws.close();
            }
          })().catch((error) => {
            console.error("Browser diagnostics failed:", error);
          });
          NODE

          # Capture cgroup-level accounting (the hard limit applies to the
          # combined Node.js, Xvfb, kiosk launcher and Chromium process tree).
          {
            echo "memory.max=$(sudo cat "${CGROUP_PATH}/memory.max")"
            echo "memory.swap.max=$(sudo cat "${CGROUP_PATH}/memory.swap.max")"
            echo "memory.current=$(sudo cat "${CGROUP_PATH}/memory.current")"
            echo "memory.peak=$(sudo cat "${CGROUP_PATH}/memory.peak")"
            echo "--- memory.events ---"
            sudo cat "${CGROUP_PATH}/memory.events"
            echo "--- memory.stat ---"
            sudo cat "${CGROUP_PATH}/memory.stat"
          } | tee benchmark-results/cgroup-memory.txt

          sudo journalctl -u magicmirror-server.service --no-pager > benchmark-results/server-journal.log || true
          sudo journalctl -u magicmirror-kiosk.service --no-pager > benchmark-results/kiosk-journal.log || true

          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("benchmark-results/runtime-resources.json", "utf8"));
          const summary = report.summary;
          if (!summary.sampleCount || !Number.isFinite(summary.peakTargetPssBytes)) {
            throw new Error("No usable process PSS samples were collected.");
          }
          const mib = (bytes) => (bytes / 1024 / 1024).toFixed(1);
          console.log("10-minute constrained runtime benchmark summary:");
          console.log(JSON.stringify({
            samples: summary.sampleCount,
            peakTargetPssMiB: mib(summary.peakTargetPssBytes),
            peakTargetRssMiB: mib(summary.peakTargetRssBytes),
            minimumMemAvailableMiB: mib(summary.minimumMemAvailableBytes),
            peakProcessCount: summary.peakTargetProcessCount,
            peakTemperaturesC: summary.peakTemperaturesC,
            peakProcesses: summary.peakPssProcesses
          }, null, 2));
          NODE

          if ! curl --silent --fail http://127.0.0.1:8080/ >/dev/null; then
            echo "Serveronly became unavailable during the constrained measurement." >&2
            exit 1
          fi
          if ! systemctl is-active --quiet magicmirror-kiosk.service; then
            echo "The kiosk service did not survive the constrained measurement." >&2
            exit 1
          fi

          OOM_EVENTS="$(sudo awk '$1 == "oom" {print $2}' "${CGROUP_PATH}/memory.events")"
          OOM_KILLS="$(sudo awk '$1 == "oom_kill" {print $2}' "${CGROUP_PATH}/memory.events")"
          OOM_EVENTS="${OOM_EVENTS:-0}"
          OOM_KILLS="${OOM_KILLS:-0}"
          if [ "${OOM_EVENTS}" -ne 0 ] || [ "${OOM_KILLS}" -ne 0 ]; then
            echo "Memory pressure triggered OOM events: oom=${OOM_EVENTS}, oom_kill=${OOM_KILLS}" >&2
            exit 1
          fi

      - name: Stop benchmark services
        if: always()
        run: |
          sudo systemctl stop magicmirror-kiosk.service magicmirror-server.service magicmirror-xvfb.service 2>/dev/null || true
          sudo systemctl stop magicmirror-benchmark.slice 2>/dev/null || true
          sudo systemctl daemon-reload || true

      - name: Upload constrained runtime benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicmirror-runtime-benchmark-1gb
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14
